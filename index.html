<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Games Vault</title>
  <meta name="description" content="A curated vault of the best fully offline games for PC, console, and mobile.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card">
      <p class="gate-kicker">Offline Games Vault</p>
      <h1>Enter a username</h1>
      <p class="gate-copy">You need a unique username to use the vault. If it is taken, pick a different one.</p>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="Your username" required>
      <div id="password-wrap" class="hidden">
        <label for="password">Master password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      </div>
      <p id="gate-error" class="error" hidden></p>
      <button type="submit">Enter vault</button>
    </form>
  </div>

  <div id="app" hidden>
    <header>
      <div class="container header-row">
        <div>
          <h1>Offline Games Vault</h1>
          <p class="tagline">Signed in as <strong id="who"></strong></p>
        </div>
        <div class="header-actions">
          <button id="toggle-users" class="ghost-btn" hidden>Show users</button>
          <button id="sign-out" class="ghost-btn">Sign out</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="admin" class="admin" hidden>
        <h2>Control account</h2>
        <p>See who is registered. You can delete users from here.</p>
        <ul id="user-list"></ul>
      </section>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="rpg">RPG</button>
        <button class="filter-btn" data-filter="action">Action / Roguelike</button>
        <button class="filter-btn" data-filter="cozy">Cozy / Sim</button>
        <button class="filter-btn" data-filter="strategy">Strategy / Puzzle</button>
        <button class="filter-btn" data-filter="sandbox">Sandbox / Survival</button>
      </div>
      <div class="games-grid" id="games-grid"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
